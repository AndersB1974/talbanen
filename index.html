<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Talbanen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: one calm centred column on squared maths paper; the daily-round card and the question card are the only "sticker" objects */
:root{
  --paper:#f6f8fc; --grid:#dde5f2; --card:#ffffff; --ink:#1b2440; --muted:#5a6684; --line:#cdd5e5;
  --pen:#2b55c8; --pen-soft:#e5ecfc; --mark:rgba(255,214,64,.7); --good:#16804c; --good-soft:#ddf3e7;
  --bad:#bf3b35; --bad-soft:#fbe4e2; --flame:#ea6a22; --shadow:#1b2440; --lock:#b8c1d4;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141f; --grid:#1a2133; --card:#171e2f; --ink:#e8ecf6; --muted:#9ba6c2; --line:#2c3652;
  --pen:#89a8ff; --pen-soft:#22305a; --mark:rgba(240,196,48,.38); --good:#52cf8f; --good-soft:#15392a;
  --bad:#ff8077; --bad-soft:#42211f; --flame:#ff9550; --shadow:#04060b; --lock:#3a4460; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141f; --grid:#1a2133; --card:#171e2f; --ink:#e8ecf6; --muted:#9ba6c2; --line:#2c3652;
  --pen:#89a8ff; --pen-soft:#22305a; --mark:rgba(240,196,48,.38); --good:#52cf8f; --good-soft:#15392a;
  --bad:#ff8077; --bad-soft:#42211f; --flame:#ff9550; --shadow:#04060b; --lock:#3a4460; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hl{background:linear-gradient(transparent 52%,var(--mark) 52%);padding-inline:2px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:10px 20px;font-weight:700;min-height:46px}
.btn:hover{background:var(--pen-soft)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1322}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:10px}
.btn.ghost:hover{background:var(--pen-soft)}
.btn.small{min-height:36px;padding:6px 14px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sticker{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--shadow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
section{display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl .bar{height:12px;border-radius:999px;background:var(--pen-soft);border:1px solid var(--line);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--pen);border-radius:999px;transition:width .6s ease}
.streak{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px}
.streak b{font-family:var(--display);font-size:1.9rem;line-height:1}
.streak small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.flame{width:30px;height:36px;flex:none}
.flame path{fill:var(--flame)}
.flame.off path{fill:var(--lock)}
.shields{display:flex;gap:3px;margin-top:3px}
.shield{width:12px;height:14px}
.shield path{fill:var(--pen)}

/* round card */
.round{padding:22px;display:grid;gap:14px}
.round .meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem;background:var(--paper)}
.tag.cur{border-color:var(--pen);color:var(--pen);font-weight:700}
.done-msg{display:flex;gap:12px;align-items:center}
.check{width:40px;height:40px;border-radius:50%;background:var(--good);display:grid;place-items:center;flex:none}
.check svg{width:22px;height:22px}
.check path{stroke:var(--card);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.day.on i{background:var(--flame);border:2px solid var(--flame)}
.day.today span{color:var(--ink);font-weight:700}
.day.today i{border-color:var(--ink)}
.day.on.today i{border-color:var(--ink)}

/* chapter map */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chap{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chap:hover{border-color:var(--pen)}
.chap .n{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--muted)}
.chap .t{font-weight:700;line-height:1.25}
.chap .s{font-size:.8rem;color:var(--muted)}
.chap.now{border:2px solid var(--pen);background:var(--pen-soft)}
.chap.now .n{color:var(--pen)}
.chap.later{opacity:.72}
.stars{display:inline-flex;gap:2px}
.stars svg{width:15px;height:15px}
.stars path{fill:var(--lock)}
.stars .on path{fill:#f2b81b}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.78rem;line-height:1.2;color:var(--muted)}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1rem;border:2px dashed var(--lock);color:var(--lock)}
.badge.got{color:var(--ink)}
.badge.got .medal{border:3px solid var(--ink);background:var(--mark);color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:10px;border-radius:999px;background:var(--line)}
.prog i.ok{background:var(--good)}
.prog i.half{background:#e8a23a}
.prog i.no{background:var(--bad)}
.prog i.cur{background:var(--pen)}
.combo{font-family:var(--display);font-weight:800;color:var(--flame);min-width:58px;text-align:right}
.qcard{padding:22px;display:flex;flex-direction:column;gap:18px}
.qtext{font-size:1.32rem;line-height:1.45}
.qtext .big{font-family:var(--display);font-weight:800;font-size:1.5rem;white-space:nowrap}
.fig{display:block;max-width:100%;height:auto;margin-inline:auto}
.fig .shape{fill:var(--pen-soft);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .ln{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.fig .dash{stroke:var(--pen);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig .arc{stroke:var(--pen);stroke-width:2.5;fill:none}
.fig .gridl{stroke:var(--line);stroke-width:1}
.fig .axis{stroke:var(--muted);stroke-width:1.6}
.fig .axis.hot{stroke:var(--flame);stroke-width:3}
.fig .pt{fill:var(--pen)}
.fig text{fill:var(--ink);font-family:var(--body);font-size:12px}
.fig .lbl{font-weight:700;font-size:14px}
.fig .tick{fill:var(--muted);font-size:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:2px solid var(--ink);border-radius:8px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--paper);font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin-inline:2px;font-variant-numeric:tabular-nums}
.fr span:first-child{border-bottom:2px solid currentColor;padding-inline:3px}
.fr span{padding-inline:2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1.12rem;min-height:56px}
.choice:hover:not([disabled]){border-color:var(--pen);background:var(--pen-soft)}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.choice.picked-wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;opacity:.8}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice[disabled]{cursor:default}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inwrap{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding-inline:14px;min-height:56px;flex:1 1 200px;max-width:340px}
.inwrap input{border:0;background:transparent;font:inherit;font-size:1.35rem;font-family:var(--display);font-weight:800;width:100%;min-width:0;color:var(--ink);padding:8px 0;outline:none}
.inwrap .unit{color:var(--muted);font-weight:700;padding-left:8px;white-space:nowrap}
.inwrap.bad{border-color:var(--bad);background:var(--bad-soft)}
.inwrap.good{border-color:var(--good);background:var(--good-soft)}
.hintbox{border-left:4px solid var(--pen);background:var(--pen-soft);padding:10px 14px;border-radius:0 10px 10px 0}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.try{background:var(--paper);border:1px dashed var(--bad)}
.fb strong{font-family:var(--display);font-size:1.15rem}
.fb .book{font-size:.85rem;color:var(--muted)}
.xpfloat{font-family:var(--display);font-weight:800;color:var(--good)}
.qactions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* done */
.result{padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.bignum{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.newbadges{display:flex;flex-wrap:wrap;gap:14px}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.burst i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.lvl .bar i{transition:none}}

/* parent */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:38px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:360px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--paper);border:1px solid var(--line);max-width:100%}
.cal i.on{background:var(--flame);border-color:var(--flame)}
.cal i.part{background:var(--mark)}
.cal i.today{outline:2px solid var(--ink)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--pen-soft);color:var(--pen)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.talk{display:grid;gap:12px}
.talk .item{border-left:4px solid var(--pen);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.talk .item.warn{border-color:var(--flame)}
.together{border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:.93rem}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;border:2px solid var(--ink);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);word-break:break-all}
select{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);max-width:100%}
.banner{border:2px solid var(--pen);background:var(--pen-soft);border-radius:12px;padding:10px 14px}
.goal{font-size:.85rem;color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9}
</style>

<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
const app = document.getElementById('app');

/* ---------- small helpers ---------- */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const nf = (x, d = 3) => { const r = Math.round(x * 10 ** d) / 10 ** d; return r.toLocaleString('da-DK', { maximumFractionDigits: d }).replace('-', '−'); };
const sg = n => n < 0 ? '−' + (-n) : String(n);
const par = n => n < 0 ? '(' + sg(n) + ')' : String(n);
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => String(h).replace(/<span class="fr"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g, '$1/$2').replace(/<svg[\s\S]*?<\/svg>/g, '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
const PI = 3.14;

function mc(text, answer, wrongs, o = {}) {
  const opts = [answer];
  for (const w of wrongs) if (!opts.includes(w) && opts.length < 4) opts.push(w);
  return Object.assign({ type: 'mc', text, answer, choices: shuf(opts) }, o);
}
function num(text, answer, o = {}) { return Object.assign({ type: 'num', text, answer, tol: 1e-6 }, o); }

/* ---------- small drawings ---------- */
function angleSVG(v) {
  const cx = 90, cy = 92, L = 74, rad = v * Math.PI / 180;
  const x2 = cx + L * Math.cos(rad), y2 = cy - L * Math.sin(rad);
  let mark;
  if (v === 90) mark = `<path class="arc" d="M${cx + 16} ${cy} L${cx + 16} ${cy - 16} L${cx} ${cy - 16}"/>`;
  else { const r = 20, ax = cx + r * Math.cos(rad), ay = cy - r * Math.sin(rad); mark = `<path class="arc" d="M${cx + r} ${cy} A${r} ${r} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}"/>`; }
  return `<svg class="fig" viewBox="0 0 180 104" width="220"><path class="ln" d="M${cx} ${cy} L${cx + L} ${cy}"/><path class="ln" d="M${cx} ${cy} L${x2.toFixed(1)} ${y2.toFixed(1)}"/>${mark}<circle class="pt" cx="${cx}" cy="${cy}" r="3.5"/></svg>`;
}
function polySVG(pts, w = 150) {
  return `<svg class="fig" viewBox="0 0 120 120" width="${w}"><polygon class="shape" points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/></svg>`;
}
function regPts(n, r = 48) { const a = []; for (let i = 0; i < n; i++) { const t = -Math.PI / 2 + i * 2 * Math.PI / n; a.push([60 + r * Math.cos(t), 62 + r * Math.sin(t)]); } return a; }
function areaSVG(kind, a, b) {
  let body = '';
  if (kind === 'rect') body = `<rect class="shape" x="30" y="20" width="140" height="80"/><text class="lbl" x="100" y="118" text-anchor="middle">${a} cm</text><text class="lbl" x="178" y="64">${b} cm</text>`;
  if (kind === 'tri') body = `<polygon class="shape" points="25,100 175,100 120,18"/><path class="dash" d="M120 18 L120 100"/><text class="lbl" x="100" y="120" text-anchor="middle">g = ${a} cm</text><text class="lbl" x="126" y="66">h = ${b} cm</text>`;
  if (kind === 'para') body = `<polygon class="shape" points="25,100 145,100 180,25 60,25"/><path class="dash" d="M60 25 L60 100"/><text class="lbl" x="85" y="120" text-anchor="middle">g = ${a} cm</text><text class="lbl" x="66" y="68">h = ${b} cm</text>`;
  return `<svg class="fig" viewBox="0 0 230 126" width="300">${body}</svg>`;
}
function coordSVG(points, hot) {
  const S = 13, O = 130, M = 9; let g = '';
  for (let i = -M; i <= M; i++) { const p = O + i * S; g += `<path class="gridl" d="M${p} ${O - M * S} L${p} ${O + M * S}"/><path class="gridl" d="M${O - M * S} ${p} L${O + M * S} ${p}"/>`; }
  g += `<path class="axis ${hot === 'x' ? 'hot' : ''}" d="M${O - M * S} ${O} L${O + M * S} ${O}"/><path class="axis ${hot === 'y' ? 'hot' : ''}" d="M${O} ${O - M * S} L${O} ${O + M * S}"/>`;
  for (let i = -8; i <= 8; i += 2) if (i) { g += `<text class="tick" x="${O + i * S}" y="${O + 11}" text-anchor="middle">${sg(i)}</text><text class="tick" x="${O - 4}" y="${O - i * S + 3}" text-anchor="end">${sg(i)}</text>`; }
  g += `<text class="lbl" x="${O + M * S - 4}" y="${O - 6}" text-anchor="end">x</text><text class="lbl" x="${O + 6}" y="${O - M * S + 12}">y</text>`;
  for (const p of points) g += `<circle class="pt" cx="${O + p.x * S}" cy="${O - p.y * S}" r="5"/><text class="lbl" x="${O + p.x * S + 7}" y="${O - p.y * S - 7}">${p.l}</text>`;
  return `<svg class="fig" viewBox="0 0 260 260" width="260">${g}</svg>`;
}

/* ---------- calendar: Kontext+ 6, 5 teaching weeks per chapter ---------- */
const HOLIDAY_MONDAYS = ['2026-10-12', '2026-12-21', '2026-12-28', '2027-02-15', '2027-03-22'];
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dkey(new Date());
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
function teachingWeeks() { const out = []; let d = new Date(2026, 7, 10); while (out.length < 40) { const k = dkey(d); if (!HOLIDAY_MONDAYS.includes(k)) out.push(k); d.setDate(d.getDate() + 7); } return out; }
const TW = teachingWeeks();
function autoChapter() {
  const t = today(); let idx = -1;
  TW.forEach((m, i) => { if (m <= t) idx = i; });
  if (idx < 0) return 1;
  return Math.min(8, Math.floor(idx / 5) + 1);
}
function chapterWeeks(n) { const a = TW[(n - 1) * 5], b = TW[(n - 1) * 5 + 4]; const f = k => parse(k).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' }); return `${f(a)} – ${f(addDays(b, 4))}`; }

/* levels */

/* streak */
function streakAlive() { const st = S.streak; if (!st.last) return 0; const g = daysBetween(st.last, today()); return g <= 1 + st.shields ? st.count : 0; }
function bumpStreak() {
  const st = S.streak, t = today(); let used = 0;
  if (st.last === t) return 0;
  if (!st.last) st.count = 1;
  else { const g = daysBetween(st.last, t); if (g === 1) st.count++; else { const miss = g - 1; if (miss <= st.shields) { st.shields -= miss; used = miss; st.count++; } else st.count = 1; } }
  st.last = t; if (st.count % 7 === 0 && st.shields < 2) st.shields++;
  st.best = Math.max(st.best, st.count); return used;
}

/* ---------- round building ---------- */
function weakest(ids, k) {
  const t = today();
  const scored = ids.map(id => { const s = S.skills[id]; const due = !s || !s.due || s.due <= t; return { id, sc: (due ? 0 : 10) + (s ? s.box : 0) + Math.random() * 1.5 }; });
  return scored.sort((a, b) => a.sc - b.sc).slice(0, k).map(x => x.id);
}
function buildDaily() {
  const c = curChapter(), L = S.settings.len, cur = CH[c - 1].skills.map(s => s.id);
  const prev = CH.slice(0, c - 1).flatMap(ch => ch.skills.map(s => s.id));
  const nRev = prev.length ? Math.min(3, Math.round(L * .375)) : 0, nCur = L - nRev;
  const curPick = []; while (curPick.length < nCur) curPick.push(...weakest(cur, Math.min(cur.length, nCur - curPick.length)));
  const rev = weakest(prev, nRev);
  const order = []; let ci = 0, ri = 0;
  for (let i = 0; i < L; i++) { const wantRev = rev.length && ri < rev.length && (i % 3 === 2 || ci >= curPick.length); order.push(wantRev ? { id: rev[ri++], rev: true } : { id: curPick[ci++] }); }
  return order;
}

/* ---------- answer checking ---------- */
function parseNum(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/\s/g, '').replace(/(kr\.?|%|°|cm³|cm²|cm|m|km\/t|liter|l)$/i, '');
  if (/^-?\d+\/\d+$/.test(s)) { const [a, b] = s.split('/').map(Number); return b ? a / b : NaN; }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return s === '' || s === '-' ? NaN : Number(s);
}
const isRight = (q, v) => q.type === 'mc' ? v === q.answer : Math.abs(parseNum(v) - q.answer) <= q.tol + 1e-9;
const answerText = q => q.type === 'mc' ? q.answer : `${q.pre ? q.pre + ' ' : ''}${nf(q.answer, 2)}${q.unit ? ' ' + q.unit : ''}`;

function recordSkill(id, result) { // result: 'first' | 'second' | 'wrong'
  const s = sk(id), t = today();
  s.n++; if (result !== 'wrong') s.c++; if (result === 'first') s.f++;
  if (result === 'first') s.box = Math.min(5, s.box + 1); else if (result === 'wrong') s.box = Math.max(0, s.box - 2);
  s.due = addDays(t, INTERVAL[s.box]); s.last = t; s.h.push(result === 'first' ? 2 : result === 'second' ? 1 : 0); if (s.h.length > 8) s.h.shift();
  S.totals.n++; if (result !== 'wrong') S.totals.c++; if (result === 'first') S.totals.first++; if (result === 'second') S.totals.second++;
}

}

function quizView() {
  const r = R0, it = r.items[r.i], q = it.q, s = SK[it.id], ch = CH[s.ch - 1];
  const prog = r.items.map((x, i) => `<i class="${x.res === 'first' ? 'ok' : x.res === 'second' ? 'half' : x.res === 'wrong' ? 'no' : i === r.i ? 'cur' : ''}"></i>`).join('');
  let ans = '';
  if (q.type === 'mc') ans = `<div class="choices">${q.choices.map((c, i) => { const cls = it.final && c === q.answer ? 'right' : (it.tried || []).includes(c) ? 'picked-wrong' : ''; const dis = it.final || (it.tried || []).includes(c); return `<button class="choice ${cls}" data-act="mc" data-i="${i}" ${dis ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${c}</span></button>`; }).join('')}</div>`;
  else ans = `<form class="ans" id="numform" autocomplete="off"><label class="inwrap ${it.final ? (it.res === 'wrong' ? 'bad' : 'good') : it.tries ? 'bad' : ''}">${q.pre ? `<span class="unit" style="padding:0 8px 0 0">${q.pre}</span>` : ''}<input id="numin" inputmode="decimal" aria-label="Dit svar" value="${esc(it.val || '')}" ${it.final ? 'disabled' : ''}>${q.unit ? `<span class="unit">${q.unit}</span>` : ''}</label>${it.final ? '' : '<button class="btn primary" type="submit">Tjek</button>'}</form>`;
  let fb = '';

    ? `<div class="fb bad"><strong>Det var en svær en. Sådan gør man:</strong><p>${q.explain}</p><p>Svaret er <b>${answerText(q)}</b>.</p><span class="book">Mere i bogen: Viden om, s. ${ch.viden} · Du får en lignende opgave senere i runden.</span></div>`
    : `<div class="fb good"><strong>${it.praise} <span class="xpfloat">+${it.gain} XP</span></strong><p>${q.explain}</p></div>`;
  else if (it.tries) fb = `<div class="fb try"><strong>Ikke helt – prøv igen.</strong><div class="hintbox">${q.hint}</div></div>`;
  else if (it.hint) fb = `<div class="hintbox">${q.hint}</div>`;
  const title = r.mode === 'daily' ? 'Dagens runde' : 'Træning';
  return `<div class="qtop"><button class="btn ghost small" data-act="quit" aria-label="Afbryd runden">✕</button><div class="prog" aria-label="Opgave ${r.i + 1} af ${r.items.length}">${prog}</div><span class="combo">${r.combo >= 2 ? '×' + r.combo : ''}</span></div>
  <div class="sticker qcard"><span class="eyebrow">${title} · Kap. ${s.ch} ${ch.name} · ${s.name}${it.rev ? ' · gentagelse' : ''}</span>

    <div class="qactions">${it.final ? '<span></span>' : `<button class="btn ghost small" data-act="hint" ${it.hint || it.tries ? 'disabled' : ''}>Vis hint (giver 5 XP i stedet for 10)</button>`}${it.final ? `<button class="btn primary" data-act="next" id="nextbtn">${r.i + 1 < r.items.length ? 'Næste' : 'Se resultat'} →</button>` : ''}</div>
  </div><p class="muted" style="font-size:.85rem">Tip: Tryk Enter for at tjekke eller gå videre. Tast 1–4 for at vælge et svar.</p>`;
}

const PRAISE = ['Sådan!', 'Flot regnet!', 'Præcis!', 'Skarpt!', 'Rigtigt!', 'Godt tænkt!', 'Klaret!'];
function submit(val) {
  const r = R0, it = r.items[r.i], q = it.q;
  if (it.final) return;
  if (q.type === 'num') { it.val = val; if (isNaN(parseNum(val))) { toast('Skriv et tal – brug komma til decimaler'); return; } }
  if (isRight(q, val)) {
    const res = it.tries || it.hint ? 'second' : 'first';
    let gain = res === 'first' ? 10 : 5; r.combo++; S.bestCombo = Math.max(S.bestCombo, r.combo); if (r.combo >= 3) gain += 5;
    it.res = res; it.gain = gain; it.final = true; it.praise = r.combo >= 3 ? `${r.combo} i træk!` : pick(PRAISE);
    r.xp += gain; S.xp += gain; r.correct++; if (res === 'first') r.first++;
    recordSkill(it.id, res);
  } else if (!it.tries) {
    it.tries = 1; if (q.type === 'mc') (it.tried = it.tried || []).push(val); r.combo = 0; if (!it.hint) { it.hint = true; r.hints++; S.totals.hints++; }
  } else {
    if (q.type === 'mc') (it.tried = it.tried || []).push(val);
    it.res = 'wrong'; it.final = true; r.combo = 0; recordSkill(it.id, 'wrong');
    S.log.unshift({ d: today(), sk: it.id, q: strip(q.text).slice(0, 220), a: q.type === 'mc' ? strip(val) : String(val), r: strip(answerText(q)) }); S.log = S.log.slice(0, 30);
    if (r.extra < 2) { r.items.push({ id: it.id, rev: it.rev, q: SK[it.id].gen(), again: true }); r.extra++; }
  }
  save(); render();
}

function finishRound() {
  const r = R0, ms = Date.now() - r.start, t = today(), n = r.items.length;
  r.perfect = r.first === n; let bonus = 0, usedShield = 0, newStreak = false;
  if (r.mode === 'daily') {
    const d = S.days[t] || (S.days[t] = { r: 0, q: 0, c: 0, ms: 0 });
    const firstToday = !d.r; d.r++; d.q += n; d.c += r.correct; d.ms += ms;
    if (firstToday) { usedShield = bumpStreak(); newStreak = true; }
    bonus = 20 + (r.perfect ? 20 : 0);
  } else { const d = S.days[t] || (S.days[t] = { r: 0, q: 0, c: 0, ms: 0 }); d.q += n; d.c += r.correct; d.ms += ms; bonus = r.perfect ? 10 : 0; }
  S.xp += bonus; r.xp += bonus;
  S.rounds.unshift({ d: t, m: r.mode, n, c: r.correct, f: r.first, xp: r.xp, ms, h: r.hints, ch: curChapter() }); S.rounds = S.rounds.slice(0, 120);
  const nb = []; checkBadges(nb, r); r.newBadges = nb; r.usedShield = usedShield; r.newStreak = newStreak; r.ms = ms;
  const weak = {}; r.items.forEach(x => { if (x.res !== 'first') weak[x.id] = 1; }); r.weak = Object.keys(weak);
  save(); view = 'done'; render(); if (r.first >= n * .75 || nb.length) burst();
}

function doneView() {
  const r = R0, n = r.items.length, L = levelOf(S.xp);
  const msg = r.perfect ? 'Fejlfri runde. Det er stærkt.' : r.first >= n * .75 ? 'Rigtig flot runde.' : r.correct >= n * .5 ? 'Godt kæmpet – du gav ikke op.' : 'Det var svære opgaver i dag. Det er sådan, man lærer.';
  const nb = r.newBadges.map(id => { const b = BADGES.find(x => x[0] === id); return `<div class="badge got"><div class="medal">${b[1]}</div><span>${b[2]}</span></div>`; }).join('');
  return `<div class="sticker result"><span class="eyebrow">${r.mode === 'daily' ? 'Dagens runde klaret' : 'Træning klaret'}</span>
    <div class="bignum num">${r.correct} <span style="font-size:1.4rem" class="muted">af ${n} rigtige</span></div><p>${msg}</p>
    <div class="stats"><div class="stat"><b>+${r.xp}</b><span>XP · niveau ${L}</span></div><div class="stat"><b>${streakAlive()}</b><span>${r.newStreak ? 'dage i træk (+1)' : 'dage i træk'}</span></div><div class="stat"><b>${Math.max(1, Math.round(r.ms / 60000))} min</b><span>tid brugt</span></div></div>
    ${r.usedShield ? `<p class="hintbox">Et skjold reddede din stribe, fordi du sprang ${r.usedShield === 1 ? 'en dag' : r.usedShield + ' dage'} over.</p>` : ''}

    <div class="row"><button class="btn primary" data-act="home" id="homebtn">Til forsiden</button>${r.weak.length ? `<button class="btn" data-act="drill" data-sk="${r.weak[0]}">Øv ${SK[r.weak[0]].name.toLowerCase()}</button>` : ''}</div></div>`;
}

/* ---------- export / import ---------- */
function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
function unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function encode() {
  const o = Object.assign({}, S, { exportedAt: new Date().toISOString(), imported: null }); const txt = JSON.stringify(o);
  try { if ('CompressionStream' in window) { const st = new Blob([txt]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'TB1.' + b64(new Uint8Array(await new Response(st).arrayBuffer())); } } catch (e) {}
  return 'TB0.' + b64(new TextEncoder().encode(txt));
}
async function decode(code) {
  code = code.replace(/\s/g, ''); const [p, body] = [code.slice(0, 4), code.slice(4)];
  if (p === 'TB1.') { const st = new Blob([unb64(body)]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
  if (p === 'TB0.') return JSON.parse(new TextDecoder().decode(unb64(body)));
  throw new Error('format');
}

/* ---------- parent ---------- */
function statusOf(id) {
  const s = S.skills[id]; if (!s || !s.n) return ['none', 'Ikke øvet'];
  const acc = s.f / s.n; if (s.n >= 3 && acc < .5) return ['bad', 'Øv mere']; if (s.box >= 4) return ['ok', 'Sikker']; return ['mid', 'På vej'];
}
function parentView() {
  const t = today(), c = curChapter();
  const last = k => Array.from({ length: k }, (_, i) => addDays(t, -i));
  const d7 = last(7), roundsWeek = d7.filter(k => S.days[k] && S.days[k].r).length;
  const r7 = S.rounds.filter(r => daysBetween(r.d, t) < 7), q7 = r7.reduce((a, r) => a + r.n, 0), f7 = r7.reduce((a, r) => a + r.f, 0);
  const avgMin = r7.length ? Math.round(r7.reduce((a, r) => a + r.ms, 0) / r7.length / 6000) / 10 : 0;
  const start = addDays(t, -27), wd = (parse(start).getDay() + 6) % 7, calStart = addDays(start, -wd);
  const span = daysBetween(calStart, t) + 1;
  const cal = Array.from({ length: span }, (_, i) => { const k = addDays(calStart, i), d = S.days[k]; return `<i class="${d && d.r ? 'on' : d && d.q ? 'part' : ''} ${k === t ? 'today' : ''}" title="${k}${d ? ` · ${d.c}/${d.q} rigtige` : ''}"></i>`; }).join('');
  const tabs = ['overblik', 'emner', 'fejl', 'indstillinger'].map(x => `<button data-act="ptab" data-tab="${x}" aria-pressed="${parentTab === x}">${{ overblik: 'Overblik', emner: 'Emner', fejl: 'Seneste fejl', indstillinger: 'Indstillinger' }[x]}</button>`).join('');
  const banner = S.imported ? `<div class="banner">Du ser ${esc(S.name || 'hendes')}s data fra en kode, sendt ${new Date(S.imported).toLocaleString('da-DK', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}.</div>` : '';
  let body = '';
  if (parentTab === 'overblik') {
    const practiced = Object.keys(S.skills).filter(id => S.skills[id].n);
    const strong = practiced.filter(id => S.skills[id].n >= 2).sort((a, b) => (S.skills[b].box - S.skills[a].box) || (S.skills[b].f / S.skills[b].n - S.skills[a].f / S.skills[a].n)).slice(0, 2);
    let weak = practiced.filter(id => S.skills[id].n >= 2).sort((a, b) => (S.skills[a].f / S.skills[a].n - S.skills[b].f / S.skills[b].n) || (S.skills[a].box - S.skills[b].box)).filter(id => !strong.includes(id)).slice(0, 2);
    if (weak.length < 2) weak = weak.concat(CH[c - 1].skills.map(s => s.id).filter(id => !weak.includes(id) && !strong.includes(id) && stars(id) < 2).slice(0, 2 - weak.length));
    const talk = `<div class="talk">
      <div class="item"><h3>Start med det, der går godt</h3><p>${S.streak.count >= 2 ? `Hun har en stribe på ${streakAlive()} dage. ` : ''}${strong.length ? `Hun er sikrest i <b>${strong.map(id => SK[id].name.toLowerCase()).join('</b> og <b>')}</b>.` : 'Når hun har taget et par runder, kan du se her, hvad hun er stærkest i.'}</p></div>
      <div class="item warn"><h3>Løs en opgave sammen</h3><p class="muted">Lad hende forklare, hvordan hun tænker, før I ser svaret.</p>${weak.map(id => `<div class="together" data-sk="${id}"><span class="eyebrow">${SK[id].name} · Kap. ${SK[id].ch}</span><div class="slot"></div><div class="row"><button class="btn small" data-act="tq" data-sk="${id}">Ny opgave</button><button class="btn small ghost" data-act="ta">Vis svar</button></div><div class="sol" hidden></div></div>`).join('')}</div>
      <div class="item"><h3>Spørg hende</h3><p>Hvad laver I i matematik lige nu? Hvad var det sværeste i denne uge? Hvilken opgave i dag var du mest stolt af?</p></div></div>`;
    body = `<div class="kv"><div class="stat"><b>${roundsWeek}/7</b><span>dage med runde, sidste uge</span></div><div class="stat"><b>${q7 ? Math.round(f7 / q7 * 100) : '–'}${q7 ? ' %' : ''}</b><span>rigtige i første forsøg</span></div><div class="stat"><b>${avgMin || '–'}${avgMin ? ' min' : ''}</b><span>pr. runde i snit</span></div><div class="stat"><b>${levelOf(S.xp)}</b><span>niveau · ${S.xp} XP</span></div></div>
      <section><h2>Sidste 4 uger</h2><div class="cal" aria-label="Kalender over dage med runde">${cal}</div><p class="muted" style="font-size:.85rem">Orange: dagens runde klaret. Gul: kun fri træning. Ma–Sø fra venstre.</p></section>
      <section><h2>Til jeres snak</h2>${talk}</section>`;
  } else if (parentTab === 'emner') {
    body = CH.map(ch => `<section><div><span class="eyebrow">Kap. ${ch.n} · ${chapterWeeks(ch.n)}${ch.n === c ? ' · nu' : ''}</span><h2>${ch.name}</h2><p class="goal">Fælles Mål: ${ch.goal}</p></div><div class="tbl-wrap"><table><thead><tr><th>Emne</th><th>Status</th><th>Første forsøg</th><th>Sidst øvet</th></tr></thead><tbody>${ch.skills.map(s => { const st = S.skills[s.id], [cls, lab] = statusOf(s.id); return `<tr><td>${s.name}<br>${starRow(stars(s.id))}</td><td><span class="pill ${cls}">${lab}</span></td><td class="n">${st && st.n ? `${st.f}/${st.n}` : '–'}</td><td class="n">${st && st.last ? parse(st.last).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' }) : '–'}</td></tr>`; }).join('')}</tbody></table></div></section>`).join('');
  } else if (parentTab === 'fejl') {
    body = S.log.length ? `<section><h2>Opgaver hun ikke fik rigtige</h2><p class="muted">De seneste ${S.log.length}. Gode at tage op sammen – spørg, hvordan hun regnede.</p><div class="log">${S.log.map(l => `<div><span class="eyebrow">${parse(l.d).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' })} · ${SK[l.sk] ? SK[l.sk].name : ''}</span><p>${esc(l.q)}</p><p>Hendes svar: <b>${esc(l.a)}</b> · Rigtigt svar: <b>${esc(l.r)}</b></p></div>`).join('')}</div></section>` : '<p class="muted">Ingen fejl endnu. Når hun svarer forkert to gange på en opgave, kommer den med her.</p>';
  } else {

      <select id="chsel" aria-label="Kapitel"><option value="auto" ${S.settings.chapter === 'auto' ? 'selected' : ''}>Automatisk (nu: kap. ${autoChapter()} ${CH[autoChapter() - 1].name})</option>${CH.map(x => `<option value="${x.n}" ${String(S.settings.chapter) === String(x.n) ? 'selected' : ''}>Kap. ${x.n} ${x.name}</option>`).join('')}</select></section>

      <section class="panel"><h2>Indlæs statuskode</h2><p class="muted">Indsæt den statuskode, du har fået tilsendt. Det erstatter dataene i denne browser – brug det på din egen computer, eller til at gendanne hendes data.</p><textarea id="incode" aria-label="Statuskode" placeholder="TB1.…"></textarea><div class="row"><button class="btn primary" data-act="import">Indlæs kode</button></div></section>

  }
  return `<div class="row" style="justify-content:space-between"><button class="btn ghost small" data-act="home">‹ Tilbage</button></div>

}

/* ---------- render + events ---------- */
function render() {
  if (view === 'home') app.innerHTML = homeView();
  else if (view === 'practice') app.innerHTML = practiceView();
  else if (view === 'quiz') app.innerHTML = quizView();
  else if (view === 'done') app.innerHTML = doneView();
  else if (view === 'send') { app.innerHTML = sendView(); encode().then(c => { const t = document.getElementById('code'); if (t) t.value = c; }); }
  else if (view === 'parent') { app.innerHTML = parentView(); app.querySelectorAll('.together').forEach(fillTogether); }
  if (view === 'quiz') { const it = R0.items[R0.i]; if (it.final) document.getElementById('nextbtn')?.focus(); else document.getElementById('numin')?.focus(); }
}
function go(v) { view = v; resetArm = false; render(); window.scrollTo(0, 0); }
function startRound(mode, ids) { R0 = makeRound(mode, ids); go('quiz'); }

app.addEventListener('submit', e => { if (e.target.id === 'nameform') { e.preventDefault(); const v = document.getElementById('namein').value.trim(); if (v) { S.name = v.slice(0, 24); save(); render(); } return; } if (e.target.id === 'numform') { e.preventDefault(); submit(document.getElementById('numin').value); } });
app.addEventListener('change', e => {
  if (e.target.id === 'chsel') { S.settings.chapter = e.target.value; save(); toast('Kapitel gemt'); render(); }
  if (e.target.id === 'lensel') { S.settings.len = Number(e.target.value); save(); toast('Længde gemt'); }
});
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'home') go('home');
  else if (a === 'daily') startRound('daily', buildDaily());
  else if (a === 'practice') { practiceCh = null; go('practice'); }
  else if (a === 'chap') { practiceCh = Number(b.dataset.ch); go('practice'); }
  else if (a === 'pch') { practiceCh = Number(b.dataset.ch); render(); }
  else if (a === 'drill') startRound('practice', Array(5).fill(0).map(() => ({ id: b.dataset.sk })));
  else if (a === 'mixch') { const ids = CH[Number(b.dataset.ch) - 1].skills.map(s => s.id); startRound('practice', shuf(ids.concat(ids)).slice(0, 8).map(id => ({ id }))); }
  else if (a === 'mc') submit(R0.items[R0.i].q.choices[Number(b.dataset.i)]);
  else if (a === 'hint') { const it = R0.items[R0.i]; if (!it.hint) { it.hint = true; R0.hints++; S.totals.hints++; save(); render(); } }
  else if (a === 'next') { if (R0.i + 1 < R0.items.length) { R0.i++; render(); } else finishRound(); }
  else if (a === 'quit') { if (R0 && R0.items.some(x => x.final)) { const d = S.days[today()] || (S.days[today()] = { r: 0, q: 0, c: 0, ms: 0 }); d.q += R0.items.filter(x => x.final).length; d.c += R0.items.filter(x => x.final && x.res !== 'wrong').length; save(); } go('home'); }
  else if (a === 'send') go('send');
  else if (a === 'copy') { const t = document.getElementById('code'); try { await navigator.clipboard.writeText(t.value); toast('Koden er kopieret'); } catch (err) { t.focus(); t.select(); toast('Markeret – tryk ⌘C for at kopiere'); } }
  else if (a === 'parent') { parentTab = 'overblik'; go('parent'); }
  else if (a === 'ptab') { parentTab = b.dataset.tab; resetArm = false; render(); }
  else if (a === 'tq') fillTogether(b.closest('.together'));
  else if (a === 'ta') { const s = b.closest('.together').querySelector('.sol'); s.hidden = !s.hidden; }
  else if (a === 'import') { const v = document.getElementById('incode').value.trim(); if (!v) { toast('Indsæt en kode først'); return; } try { const o = await decode(v); if (!o || o.v !== 1) throw 0; S = Object.assign(blank(), o, { imported: o.exportedAt || new Date().toISOString() }); save(); parentTab = 'overblik'; toast('Koden er indlæst'); render(); } catch (err) { toast('Koden kunne ikke læses. Tjek at hele koden er kopieret med.'); } }
  else if (a === 'reset') { if (!resetArm) { resetArm = true; render(); } else { S = blank(); save(); resetArm = false; toast('Alt er nulstillet'); go('home'); } }
  else if (a === 'unreset') { resetArm = false; render(); }
});
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !R0) return; const it = R0.items[R0.i];
  if (e.key === 'Enter' && it.final) { e.preventDefault(); document.getElementById('nextbtn')?.click(); return; }
  if (!it.final && it.q.type === 'mc' && /^[1-4]$/.test(e.key)) { const i = Number(e.key) - 1, c = it.q.choices[i]; if (c !== undefined && !(it.tried || []).includes(c)) submit(c); }
});

render();
window.__talbane = { CH, SK, parseNum, isRight };
})();
</script>
